[workspace]
resolver = "2"
members = [
    "crates/heal-core",
    "crates/heal-capture",
    "crates/heal-jev",
    "crates/heal-reify",
    "crates/heal-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["jev-heal contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/fuck-jev"

[workspace.dependencies]
heal-core = { path = "crates/heal-core" }
heal-capture = { path = "crates/heal-capture" }
heal-jev = { path = "crates/heal-jev" }
heal-reify = { path = "crates/heal-reify" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.10"
strsim = "0.11"
portable-pty = "0.8"
strip-ansi-escapes = "0.2"
clap = { version = "4.4", features = ["derive", "env"] }
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
